<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="appliant-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4338ca" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#appliant-grad)" filter="url(#glow)" />

  <!-- Modern Geometric 'A' Mark -->
  <path 
    d="M32 14L46 48H39L35.5 39.5H28.5L25 48H18L32 14ZM32 24.5L29.8 34H34.2L32 24.5Z" 
    fill="#ffffff" 
    stroke="#ffffff" 
    stroke-width="1.2" 
    stroke-linejoin="round"
  />

  <!-- Precision Dot / Sparkle Accent -->
  <circle cx="47" cy="17" r="3.5" fill="url(#sparkle-grad)" />
</svg>
